{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>To-Do</h2>
    <div>
        <span class="me-2">Hi, <strong>{{ user_name }}</strong></span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Log out</a>
    </div>
</div>

<form action="{{ url_for('add_todo') }}" method="POST" class="d-flex gap-2 mb-4">
    <input type="text" name="title" class="form-control" placeholder="What needs to be done?" required maxlength="200">
    <button type="submit" class="btn btn-primary">Add</button>
</form>

{% if todos %}
    <ul class="list-group">
        {% for todo in todos %}
            <li class="list-group-item d-flex align-items-center justify-content-between">
                <form action="{{ url_for('toggle_todo', todo_id=todo.todo_id) }}" method="POST" class="d-inline">
                    <input type="hidden" name="is_done" value="{{ 0 if todo.is_done else 1 }}">
                    <button type="submit" class="btn btn-link text-decoration-none p-0 text-dark me-2">
                        {% if todo.is_done %}✓{% else %}○{% endif %}
                    </button>
                </form>

                <form action="{{ url_for('edit_todo', todo_id=todo.todo_id) }}" method="POST" class="d-flex gap-2 flex-grow-1 mx-2">
                    <input type="text" name="title" value="{{ todo.title }}" class="form-control form-control-sm {% if todo.is_done %}text-decoration-line-through text-muted{% endif %}" required maxlength="200">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Save</button>
                </form>

                <form action="{{ url_for('delete_todo', todo_id=todo.todo_id) }}" method="POST" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p class="text-center text-muted">No to-dos yet! Add one above.</p>
{% endif %}
{% endblock %}
