{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Edit Book</h3>

                <form action="{{ url_for('edit_book', book_id=book.book_id) }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Book Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Price ($)</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ book.price }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="author_id" class="form-label">Author</label>
                        <select name="author_id" id="author_id" class="form-select" required>
                            {% for author in authors %}
                                <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>
                                    {{ author.name }} (ID: {{ author.author_id }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('list_books') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Update Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
