{% extends 'base.html' %}

{% block content %}
<h2>Library Books</h2>

<!-- Add Book Form -->
<div class="card my-3 p-3">
    <h4>Add New Book</h4>
    <form action="{{ url_for('add_book') }}" method="POST" class="row g-3">
        <div class="col-md-4">
            <input type="text" name="title" class="form-control" placeholder="Book Title" required>
        </div>
        <div class="col-md-3">
            <input type="number" step="0.01" name="price" class="form-control" placeholder="Price ($)" required>
        </div>
        <div class="col-md-3">
            <select name="author_id" class="form-select" required>
                <option value="">Select Author</option>
                {% for author in authors %}
                    <option value="{{ author.author_id }}">{{ author.name }} (ID: {{ author.author_id }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Add Book</button>
        </div>
    </form>
</div>

<!-- Books Table -->
<table class="table table-striped align-middle">
    <thead>
        <tr>
            <th>Book ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Author ID</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book.book_id }}</td>
            <td>{{ book.title }}</td>
            <td>${{ "%.2f"|format(book.price) }}</td>
            <td>{{ book.author_id }}</td>
            <td>
                <a href="{{ url_for('edit_book', book_id=book.book_id) }}" class="btn btn-sm btn-warning me-1">Edit</a>
                <form action="{{ url_for('delete_book', book_id=book.book_id) }}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete book?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
